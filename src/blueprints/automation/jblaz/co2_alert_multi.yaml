blueprint:
  name: CO₂ Alert (Multi-Sensor)
  description: >-
    Multi-sensor CO₂ alert with mobile notifications and an optional script.
    Alerts once a sensor has stayed above the threshold, refreshes the reading
    on a fixed interval while it stays high, and clears when it falls back to a
    separate recovery threshold.
  domain: automation

  input:
    co2_sensors:
      name: CO₂ Sensors
      description: Select one or more CO₂ sensors to monitor.
      selector:
        entity:
          multiple: true
          domain: sensor
          device_class: carbon_dioxide

    threshold:
      name: Alert Threshold (ppm)
      description: CO₂ level that triggers the alert for all sensors.
      default: 1000
      selector:
        number:
          min: 400
          max: 2000
          step: 50
          unit_of_measurement: ppm

    clear_threshold:
      name: Recovery Threshold (ppm)
      description: >-
        CO₂ must fall below this before the alert clears. Keep it comfortably
        below the alert threshold — if the two are equal, a sensor resting on
        the boundary flaps between alerting and clearing.
      default: 900
      selector:
        number:
          min: 350
          max: 2000
          step: 50
          unit_of_measurement: ppm

    duration:
      name: Time Above Threshold
      description: How long a sensor must stay above the threshold before alerting.
      default:
        minutes: 2
      selector:
        duration: {}

    clear_duration:
      name: Time Below Recovery Threshold
      description: How long a sensor must stay below the recovery threshold before clearing.
      default:
        minutes: 5
      selector:
        duration: {}

    refresh_interval:
      name: Reading Refresh
      description: >-
        How often to update the ppm shown while an alert is active. The existing
        notification is replaced in place — you are not sent a new one.
      default: "/15"
      selector:
        select:
          options:
            - label: Every 5 minutes
              value: "/5"
            - label: Every 10 minutes
              value: "/10"
            - label: Every 15 minutes
              value: "/15"
            - label: Every 30 minutes
              value: "/30"

    notify_device:
      name: Devices to Notify
      description: Select mobile devices to receive notifications.
      default: []
      selector:
        device:
          integration: mobile_app
          multiple: true

    optional_script:
      name: Script to Run (Optional)
      description: Script to run when an alert first fires.
      default: ""
      selector:
        entity:
          domain: script

    action_conditions:
      name: Action Conditions (Optional)
      description: Additional conditions required before notifying or running the script.
      default: []
      selector:
        condition: {}

mode: queued
max: 10

triggers:
  - trigger: numeric_state
    entity_id: !input co2_sensors
    above: !input threshold
    for: !input duration
    id: alert_start

  - trigger: numeric_state
    entity_id: !input co2_sensors
    below: !input clear_threshold
    for: !input clear_duration
    id: alert_clear

  - trigger: time_pattern
    minutes: !input refresh_interval
    id: alert_refresh

variables:
  co2_sensors_list: !input co2_sensors
  notify_devices: !input notify_device
  threshold_ppm: !input threshold
  optional_script: !input optional_script
  # Sensors currently at or above the alert threshold. `namespace` is required:
  # a plain `{% set %}` inside a `{% for %}` does not survive the loop.
  # Unavailable sensors float to -1 and drop out on their own.
  high_sensors: >-
    {% set ns = namespace(hi=[]) %}
    {% for s in co2_sensors_list %}
      {% if states(s) | float(-1) >= (threshold_ppm | float) %}
        {% set ns.hi = ns.hi + [s] %}
      {% endif %}
    {% endfor %}
    {{ ns.hi }}

conditions: []

actions:
  - choose:
      # ---------------------------------------------------------------
      # Recovered — dismiss the notification for that sensor
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: alert_clear
        sequence:
          - variables:
              sensor: "{{ trigger.entity_id }}"
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ device_attr(repeat.item, 'name') is not none }}"
                  then:
                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        message: clear_notification
                        data:
                          tag: "co2_alert_{{ sensor | replace('.', '_') }}"

      # ---------------------------------------------------------------
      # First breach — alert, and run the optional script
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: alert_start
          - condition: and
            conditions: !input action_conditions
        sequence:
          - variables:
              sensor: "{{ trigger.entity_id }}"
              # Read the value that actually tripped the trigger, not the one
              # that happens to be current after the `for:` delay.
              ppm: "{{ trigger.to_state.state | float(0) | round(0) }}"
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ device_attr(repeat.item, 'name') is not none }}"
                  then:
                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        title: "🚨 High CO₂ — {{ ppm }} ppm"
                        message: >-
                          {{ area_name(sensor) or state_attr(sensor, 'friendly_name') or sensor }}
                          has reached {{ ppm }} ppm (threshold {{ threshold_ppm }} ppm).
                        data:
                          tag: "co2_alert_{{ sensor | replace('.', '_') }}"
                          sticky: true
                          persistent: true
          - if:
              - condition: template
                value_template: "{{ optional_script | default('', true) | string | length > 0 }}"
            then:
              - action: script.turn_on
                target:
                  entity_id: "{{ optional_script }}"

      # ---------------------------------------------------------------
      # Still high — refresh the ppm in place, on the chosen interval
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: alert_refresh
          - condition: template
            value_template: "{{ high_sensors | count > 0 }}"
          - condition: and
            conditions: !input action_conditions
        sequence:
          - repeat:
              for_each: "{{ high_sensors }}"
              sequence:
                # Capture the sensor before the inner repeat rebinds `repeat.item`.
                - variables:
                    sensor: "{{ repeat.item }}"
                    ppm: "{{ states(repeat.item) | float(0) | round(0) }}"
                - repeat:
                    for_each: "{{ notify_devices }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ device_attr(repeat.item, 'name') is not none }}"
                        then:
                          - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                            data:
                              title: "🚨 High CO₂ — {{ ppm }} ppm"
                              message: >-
                                {{ area_name(sensor) or state_attr(sensor, 'friendly_name') or sensor }}
                                is at {{ ppm }} ppm (threshold {{ threshold_ppm }} ppm).
                              data:
                                tag: "co2_alert_{{ sensor | replace('.', '_') }}"
                                sticky: true
                                persistent: true
